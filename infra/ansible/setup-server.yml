---
- name: Full Server Setup for AyosDocs
  hosts: webservers
  become: yes
  
  vars_files:
    - vars/secrets.yml

  vars:
    repo_url: "https://github.com/mmoriones/ayosdocs.git"

  handlers:
    - name: Restart SSH
      systemd:
        name: ssh
        state: restarted

  tasks:
    # 1. System Prep
    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes

    - name: Install prerequisite packages
      apt:
        name:
          - curl
          - git
          - make
          - software-properties-common
          - apt-transport-https
          - ca-certificates
        state: present

    # 2. Source Control
    - name: Ensure project directory exists and is up to date
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_path }}"
        version: master
        force: yes
      become: no

    # 3. Server Hardening
    - name: Install UFW and Fail2Ban
      apt:
        name:
          - ufw
          - fail2ban
        state: present

    - name: Configure UFW - Allow SSH
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Configure UFW - Allow HTTP
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Configure UFW - Allow HTTPS
      ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Configure UFW - Deny all other incoming
      ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Ensure Fail2Ban is running
      systemd:
        name: fail2ban
        state: started
        enabled: yes

    - name: Harden SSH - Disable password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: Restart SSH

    - name: Harden SSH - Disable root login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin prohibit-password'
      notify: Restart SSH

    # 4. Docker & Docker Compose Setup
    - name: Create directory for Docker GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG apt Key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: yes

    - name: Add Docker Repository
      apt_repository:
        repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine
      apt:
        name: 
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add current user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Reset connection to apply group changes
      meta: reset_connection

    # 5. Secrets & Env Configuration
    - name: Create .env file in app/ dir
      copy:
        content: |
          {{ vault_global_shared_env }}
          {{ vault_server_env }}
        dest: "{{ project_path }}/app/.env"
        mode: '0600'
        owner: "{{ ansible_user }}"

    - name: Create rclone config for backups
      copy:
        content: "{{ vault_rclone_conf_content }}"
        dest: "{{ project_path }}/docker/monitoring/rclone.conf"
        mode: '0600'
        owner: "{{ ansible_user }}"

    # 7. Final Verification
    - name: Verify Docker Compose is accessible
      command: docker compose version
      register: compose_version
      changed_when: false

    - name: Print Compose version
      debug:
        msg: "Docker Compose version: {{ compose_version.stdout }}"
