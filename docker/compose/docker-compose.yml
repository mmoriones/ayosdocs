services:
  app:
    container_name: ayosdocs-app
    image: ${IMAGE_NAME:-ghcr.io/mmoriones/ayosdocs}:latest
    restart: always
    environment:
      - MONGO_URI=${MONGO_URI}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NEXT_PUBLIC_ADSENSE_ENABLED=false
    depends_on:
      - mongodb
    networks:
      - ayosdocs-network

  watchtower:
    container_name: ayosdocs-watchtower
    image: nickfedor/watchtower:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 3 * * *
    command: --schedule "0 0 3 * * *" --cleanup
    networks:
      - ayosdocs-network

  nginx:
    container_name: ayosdocs-nginx
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - ayosdocs-network

  mongodb:
    container_name: ayosdocs-db
    image: mongo:latest
    restart: always
    volumes:
      - mongodb_data:/data/db
    networks:
      - ayosdocs-network

  # --- OBSERVABILITY STACK ---
  prometheus:
    container_name: ayosdocs-prometheus
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - ayosdocs-network

  alertmanager:
    container_name: ayosdocs-alertmanager
    image: prom/alertmanager:latest
    restart: always
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - ayosdocs-network

  grafana:
    container_name: ayosdocs-grafana
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    networks:
      - ayosdocs-network

  node-exporter:
    container_name: ayosdocs-node-exporter
    image: prom/node-exporter:latest
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - ayosdocs-network

  cadvisor:
    container_name: ayosdocs-cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - ayosdocs-network

  backup:
    container_name: ayosdocs-backup
    image: alpine:latest
    restart: always
    depends_on:
      - mongodb
    volumes:
      - ../../scripts:/scripts:ro
      - ../../backups:/backups
      - ../../docker/monitoring/rclone.conf:/root/.config/rclone/rclone.conf:ro
    entrypoint: ["sh", "-c", "apk add --no-cache mongodb-tools rclone bash && echo '0 3 * * * /scripts/backup.sh' > /etc/crontabs/root && crond -f"]
    networks:
      - ayosdocs-network

networks:
  ayosdocs-network:
    driver: bridge

volumes:
  mongodb_data:
  prometheus_data:
  grafana_data:
