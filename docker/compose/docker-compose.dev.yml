services:
  app:
    container_name: ayosdocs-app-dev
    build:
      context: ../../
      dockerfile: app/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/ayosdocs}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AI_ENABLED=${AI_ENABLED:-true}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
    depends_on:
      - mongodb
      - qdrant
    networks:
      - ayosdocs-network

  mongodb:
    container_name: ayosdocs-db-dev
    image: mongo:latest
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - ayosdocs-network

  qdrant:
    container_name: ayosdocs-qdrant-dev
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_dev_data:/qdrant/storage
    networks:
      - ayosdocs-network

networks:
  ayosdocs-network:
    driver: bridge

volumes:
  mongodb_dev_data:
  qdrant_dev_data:
